site_name: LibreIncu-150
site_description: Manual de montaje e inventario de la incubadora LibreIncu-150
site_url: https://pablomonte.github.io/LibreIncu-150/
docs_dir: docs
exclude_docs: |
  img/piezas/manifiesto.md

theme:
  name: material
  language: es
  icon:
    logo: material/egg
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.top
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest

nav:
  - Inicio: index.md
  - Antes de fabricar: antes-de-fabricar.md
  - Compra y corte: compra-y-corte.md
  - Montaje mecanico: montaje-mecanico.md
  - Instalacion electrica: instalacion-electrica.md
  - Puesta en marcha: puesta-en-marcha.md
  - Troubleshooting: troubleshooting.md
  - Vista 3D: vista-3d.md
  - Inventario CAD: inventario.md
  - Anexos: anexos.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - .
        - Rediseno
      check_paths: true

plugins:
  - search
